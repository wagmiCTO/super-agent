  /* Gray on purpose: the prototype checks order, words and feel, not the look. */
  /* Every colour, size and face the prototype uses. Nothing below this block
     names a literal colour: swapping a theme means swapping this block only.
     `data-theme` on <html> selects a set; the gray set is the control. */
  :root {
    /* surfaces, back to front */
    --ground: #E9E9EC; --paper: #FFFFFF; --raised: #FAFAFA; --soft: #F4F4F5;
    /* lines */
    --line: #D4D4D8; --hair: #E4E4E7;
    /* text, strongest to weakest */
    --ink: #18181B; --body: #3F3F46; --text2: #52525B; --muted: #71717A; --dim: #A1A1AA;
    /* text drawn on an ink-filled surface */
    --onInk: #FFFFFF;
    /* brand accent — kept apart from up/down on purpose: when they share a
       value, reusing one for the other silently turns "accent" into "profit" */
    --accent: #18181B; --onAccent: #FFFFFF;
    /* the strong filled surface: buttons, banners, the splash, toasts.
       On gray it is the text colour; on a real theme it is not. */
    --fill: #18181B; --onFill: #FFFFFF;
    --up: #18181B; --onUp: #FFFFFF; --down: #18181B; --onDown: #FFFFFF;
    /* states */
    --danger: #DC2626; --danger-soft: #FEE2E2; --onDanger: #FFFFFF;
    --risk-calm: #18181B; --risk-warm: #18181B; --risk-hot: #18181B;
    /* overlays and depth */
    --scrim: rgba(24,24,27,0.35); --glass: rgba(255,255,255,0.85);
    --glow: rgba(255,255,255,0.25); --chip: rgba(24,24,27,0.8); --onChip: #FFFFFF;
    --shadow-phone: rgba(24,24,27,0.18); --shadow-menu: rgba(24,24,27,0.16);
    --ring: rgba(24,24,27,0.35); --ring-0: rgba(24,24,27,0);
    /* chart */
    --chart-line: #18181B; --chart-grid: #E4E4E7; --chart-axis: #D4D4D8;
    --chart-up: #3F3F46; --chart-down: #A1A1AA; --chart-zone: rgba(24,24,27,0.06);
    --chart-band: #E4E4E7;
    --chart-line2: #A1A1AA; --onAccentDim: #D4D4D8; --btn-line: #18181B;
    /* type */
    --font-display: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: var(--font-display);
    /* shape, rhythm and type are part of the theme, not of the markup:

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 14px; --s5: 20px; --s6: 24px;
    --t-2xs: 10px; --t-xs: 12px; --t-sm: 14px; --t-md: 15px; --t-lg: 17px;
    --t-xl: 20px; --t-2xl: 28px; --t-3xl: 32px; --t-hero: 44px; --t-mega: 56px;
    --h1-weight: 700; --h1-track: -0.01em; --bw: 1px;
    --elev: none; --elev-lift: none;
    --card-bg: var(--soft); --card-line: transparent;
    --btn-h: 52px; --btn-weight: 600; --ud-h: 76px; --track: 0.04em;
  }

    --chart-line: #0E100F; --chart-grid: #E8E4DE; --chart-axis: #DAD5CE;
    --chart-up: #1C9A6B; --chart-down: #DC5546; --chart-zone: rgba(131,110,249,0.08);
    --chart-band: #F3F1EE;
    --chart-line2: #97918A; --onAccentDim: #CFC4FC; --btn-line: #DAD5CE;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-num: 'Space Mono', ui-monospace, monospace;
    --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
    --s1: 5px; --s2: 10px; --s3: 14px; --s4: 18px; --s5: 22px; --s6: 28px;
    --t-2xs: 11px; --t-xs: 12px; --t-sm: 14px; --t-md: 16px; --t-lg: 18px;
    --t-xl: 22px; --t-2xl: 29px; --t-3xl: 34px; --t-hero: 46px; --t-mega: 60px;
    --h1-weight: 700; --h1-track: -0.025em; --bw: 1px;
    --elev: 0 1px 2px rgba(14,16,15,0.05), 0 8px 24px rgba(14,16,15,0.05);
    --card-bg: var(--paper); --card-line: transparent;
    --btn-h: 56px; --btn-weight: 700; --ud-h: 82px; --track: 0.05em;

  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-display); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }

  .btn { height: var(--btn-h); border-radius: var(--r-lg); display: flex; align-items: center; justify-content: center; gap: var(--s2); font-size: var(--t-lg); font-weight: var(--btn-weight); box-sizing: border-box; }

  .row { display: flex; justify-content: space-between; align-items: center; font-size: var(--t-sm); color: var(--body); }
  .row b { font-weight: 600; color: var(--ink); }
  .badge { font-size: var(--t-xs); font-weight: 600; letter-spacing: var(--track); padding: var(--s1) var(--s2); border-radius: var(--r-sm); border: 1px solid var(--line); color: var(--text2); white-space: nowrap; }
  .badge.dark { background: var(--accent); color: var(--onAccent); border-color: var(--accent); }
  .head { display: flex; align-items: center; gap: var(--s3); min-width: 0; overflow: hidden; }
  .head .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .head .chips { flex-wrap: nowrap; }
  .head .chip { padding: var(--s1) var(--s2); font-size: var(--t-xs); }
  .head .title { font-size: var(--t-md); font-weight: 600; }
  .head .back { font-size: var(--t-sm); color: var(--muted); padding: var(--s2) 0; white-space: nowrap; }
  .head .right { margin-left: auto; display: flex; align-items: center; gap: var(--s2); white-space: nowrap; flex-shrink: 0; }
  .head .right .num { font-size: var(--t-xs); }
  .qmark { width:28px;height:28px;border-radius:50%; border: var(--bw) solid var(--line); display: flex; align-items: center; justify-content: center; font-size: var(--t-sm); color: var(--text2); }
  .pill { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border-radius: 999px; border: var(--bw) solid var(--line); font-size: var(--t-sm); font-weight: 600; }
  .chip { padding: var(--s2) var(--s3); border-radius: var(--r-md); font-size: var(--t-sm); font-weight: 600; border: var(--bw) solid var(--line); color: var(--body); white-space: nowrap; }
  .chip.on { background: var(--accent); color: var(--onAccent); border-color: var(--accent); }
  .chips { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .term { border-bottom: var(--bw) dashed var(--dim); text-underline-offset: 3px; }
  .toast { padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--card-bg); border: var(--bw) solid var(--card-line); font-size: var(--t-sm); line-height: 1.4; }
  .toast.error { background: var(--danger-soft); }
  .updown { display: flex; gap: var(--s3); }
  .ud { flex: 1; height: var(--ud-h); border-radius: var(--r-xl); border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box; background: var(--up); color: var(--onUp); transition: background .18s, color .18s, border-color .18s; }
  .ud[data-side="down"] { background: var(--down); color: var(--onDown); }
  .ud .l { font-size: var(--t-xl); font-weight: 700; }

  .ud.ghost { background: transparent; color: var(--up); border-color: var(--up); }
  .ud.ghost[data-side="down"] { background: transparent; color: var(--down); border-color: var(--down); }
  .dim { opacity: 0.4; pointer-events: none; }
  .sheetbg { position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; }
  .sheet { width: 100%; border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--elev-lift); background: var(--paper); padding: var(--s5) var(--s5) var(--s6); box-sizing: border-box; display: flex; flex-direction: column; gap: var(--s3); }
  .grab { width:36px;height:4px;border-radius:999px; background: var(--line); align-self: center; }
  .dots { display: flex; gap: var(--s2); }

  .toggle.on::after { transform: translateX(18px); }
  input[type=number] { font: inherit; font-size: var(--t-3xl); font-weight: 700; letter-spacing: -0.01em; border: 0; outline: 0; width: 120px; background: transparent; color: var(--ink); padding: 0; }
  /* Exchange-style slider: a thin track, a filled left half, a square-ish
     grip. The browser default reads as a form control, not an instrument. */
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }

  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: var(--r-sm); background: var(--accent); border: 2px solid var(--paper); cursor: pointer; }
  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper { display: flex; align-items: center; gap: var(--s3); }
  .stepper div[data-a] { width:32px;height:32px;border-radius:50%; border: var(--bw) solid var(--line); display: flex; align-items: center; justify-content: center; font-size: var(--t-lg); }
  .pinned { position: sticky; bottom: 0; background: var(--paper); margin: var(--s2) calc(-1 * var(--s5)) 0; padding: var(--s3) var(--s5) 0; display: flex; flex-direction: column; gap: var(--s3); }
  .footer-links { display: flex; align-items: center; justify-content: space-between; font-size: var(--t-sm); color: var(--muted); }

  #note { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fill); color: var(--onFill); padding: var(--s3) var(--s4); border-radius: var(--r-md); font-size: var(--t-sm); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }

  .menu > div { padding: var(--s3) var(--s3); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
