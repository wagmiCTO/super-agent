    --accent: #18181B; --onAccent: #FFFFFF;

       On gray it is the text colour; on a real theme it is not. */

    --chart-up: #3F3F46; --chart-down: #A1A1AA; --chart-zone: rgba(24,24,27,0.06);
    --chart-band: #E4E4E7;
