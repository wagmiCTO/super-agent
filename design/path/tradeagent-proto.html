<script>

// ---------------------------------------------------------------- state
const TICK = 100;                 // ms
const MINUTES_PER_45S = 15;       // the prototype compresses a 15-minute horizon into 45 s
const FEE_BPS = 3.45;             // round trip, taker, both legs
const MARKET = { symbol: 'BTC', maxLev: 15 };
const NAMES = { direction: 'Direction', ma: 'MA Cross', rsi: 'RSI Bounce' };
const el = (id) => document.getElementById(id);
const fillOf = (v, min, max) => `--p:${Math.round((v - min) / (max - min) * 100)}%`;

const ohlc = (n, seed, drift = 0, vol = 1) => {

  for (let i = 0; i < n; i++) {
    const o = p, c = o + (r() - 0.5) * 3.4 * vol + drift;
    out.push({ o, c, h: Math.max(o, c) + r() * 1.5 * vol, l: Math.min(o, c) - r() * 1.5 * vol });
    p = c;
  }
  return out;
};
const sma = (d, n) => d.map((_, i) => {
  const a = d.slice(Math.max(0, i - n + 1), i + 1);
  return a.reduce((x, y) => x + y.c, 0) / a.length;
});
const rsiOf = (d, n = 14) => d.map((_, i) => {
  const a = d.slice(Math.max(1, i - n + 1), i + 1);
  let up = 0, dn = 0;
  a.forEach((c, k) => { const prev = d[Math.max(0, i - a.length + 1 + k - 1)].c; const m = c.c - prev; m >= 0 ? up += m : dn -= m; });
  return dn === 0 ? 100 : 100 - 100 / (1 + up / dn);
});

const grid = (x0, y0, w, h, rows = 4) => Array.from({ length: rows - 1 }, (_, k) =>
  `<line x1="${x0}" y1="${(y0 + h / rows * (k + 1)).toFixed(1)}" x2="${x0 + w}" y2="${(y0 + h / rows * (k + 1)).toFixed(1)}" stroke="var(--hair)" stroke-width="1"/>`).join('');

// Candles, the way a chart draws them: a wick through the range, a body
// between open and close, coloured by which way the bar went.
const candles = (d, x0, y0, w, h, o = {}) => {
  const hi = Math.max(...d.map((x) => x.h)), lo = Math.min(...d.map((x) => x.l));
  const pad = (hi - lo) * 0.09 || 1, top = hi + pad, bot = lo - pad;
  const Y = (v) => y0 + h - ((v - bot) / (top - bot)) * h;
  const step = w / d.length, bw = Math.max(2.2, step * 0.56);
  const body = d.map((c, i) => {
    const x = x0 + step * (i + 0.5), up = c.c >= c.o;
    const col = up ? 'var(--up)' : 'var(--down)';
    const t = Y(Math.max(c.o, c.c)), b = Y(Math.min(c.o, c.c));
    return `<line x1="${x.toFixed(1)}" y1="${Y(c.h).toFixed(1)}" x2="${x.toFixed(1)}" y2="${Y(c.l).toFixed(1)}" stroke="${col}" stroke-width="1.5" opacity="${o.faded ? 0.5 : 1}"/>`
         + `<rect x="${(x - bw / 2).toFixed(1)}" y="${t.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, b - t).toFixed(1)}" fill="${col}" opacity="${o.faded ? 0.5 : 1}"/>`;
  }).join('');
  return { svg: body, Y, step, x: (i) => x0 + step * (i + 0.5) };
};

// A worked example, not a test: the chart names the moment it is talking
// about and the moment it is not, so the reader learns by looking.
const shownChart = (name) => {
  const d = BARS, c = candles(d, 10, 22, 300, 150, { faded: name === 'ma' });
  const mark = (x, y, ok, label, at = 'below') => {
    const col = ok ? 'var(--up)' : 'var(--down)';
    const pos = at === 'below' ? { x, y: y + 27, a: 'middle' }
      : at === 'above' ? { x, y: y - 19, a: 'middle' }
      : at === 'left' ? { x: x - 16, y: y + 4, a: 'end' }
      : { x: x + 16, y: y + 4, a: 'start' };
    return `
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="${ok ? 'var(--up)' : 'var(--paper)'}" stroke="${ok ? 'var(--up)' : 'var(--down)'}" stroke-width="2.5"/>
    ${ok ? `<path d="M${(x - 4.5).toFixed(1)} ${y.toFixed(1)}l3.5 3.5 6.5-7" fill="none" stroke="var(--onUp)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
         : `<path d="M${(x - 4).toFixed(1)} ${(y - 4).toFixed(1)}l8 8M${(x + 4).toFixed(1)} ${(y - 4).toFixed(1)}l-8 8" stroke="var(--down)" stroke-width="2.6" stroke-linecap="round"/>`}
    <text x="${pos.x.toFixed(1)}" y="${pos.y.toFixed(1)}" font-size="10" text-anchor="${pos.a}" font-family="monospace" fill="${col}">${label}</text>`;
  };

  if (name === 'ma') {
    const f = sma(d, 5), sl = sma(d, 13);
    const line = (v, col, w) => `<polyline points="${v.map((x, i) => `${c.x(i).toFixed(1)},${c.Y(x).toFixed(1)}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`;
    const cross = []; for (let i = 15; i < d.length - 1; i++) if ((f[i] - sl[i]) * (f[i - 1] - sl[i - 1]) < 0) cross.push(i);
    const real = cross[cross.length - 1];
    let near = 16, best = Infinity;
    for (let i = 15; i < d.length - 2; i++) {
      if (Math.abs(i - real) < 12) continue;
      if (cross.some((k) => Math.abs(k - i) < 3)) continue;
      const gap = Math.abs(f[i] - sl[i]);
      if (gap < best) { best = gap; near = i; }
    }
    return frame(200, `${grid(10, 22, 300, 150)}${c.svg}${line(sl, 'var(--dim)', 2.5)}${line(f, 'var(--accent)', 3.2)}
      ${mark(c.x(real), c.Y(sl[real]), true, 'a real cross', real > d.length * 0.6 ? 'left' : 'right')}
      ${mark(c.x(near), c.Y(sl[near]), false, 'lines just close', near > d.length * 0.5 ? 'above' : 'below')}`);
  }
  // direction: a level the price keeps turning on
  const lo = Math.min(...d.map((x) => x.l)), hi = Math.max(...d.map((x) => x.h));
  const level = lo + (hi - lo) * 0.3, ly = c.Y(level);
  const touches = []; d.forEach((b, i) => { if (Math.abs(b.l - level) < (hi - lo) * 0.05) touches.push(i); });
  const bounce = touches.length ? touches[touches.length - 1] : 12;
  // the counter-example has to be far enough away to read as a separate point
  let mid = Math.min(d.length - 4, bounce + 16);
  if (mid - bounce < 10) mid = Math.max(4, bounce - 16);
  return frame(200, `${grid(10, 22, 300, 150)}${c.svg}
    <line x1="10" y1="${ly.toFixed(1)}" x2="310" y2="${ly.toFixed(1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="306" y="${(ly + 16).toFixed(1)}" font-size="10" text-anchor="end" font-family="monospace" fill="var(--accent)">the line it keeps turning on</text>
    ${mark(c.x(bounce), ly, true, 'the turn', 'below')}
    ${mark(c.x(mid), c.Y(d[mid].h) - 20, false, 'mid-move', 'above')}`);
};

}

// ---------------------------------------------------------------- render
function render() {
  const s = el('screen'); const v = V[st.screen] || V.lobby; s.innerHTML = v(); el('overlay').innerHTML = overlayHtml(); drawChart();
}
function patch() { // light updates on the tick, without rebuilding inputs the user may be touching

  else if (st.sheet === 'share' && openPos()) el('overlay').innerHTML = overlayHtml();
}

// ---------------------------------------------------------------- the clock
function tick() {
  // the market: a random walk, one step a tick
  st.price = st.price * (1 + (Math.random() - 0.5) * 0.0008); if (Math.random() < 0.2) { st.prices.push(st.price); st.prices.shift(); st.signals.rsi.series.push(st.signals.rsi.value); st.signals.rsi.series.shift(); }

  const ma = st.signals.ma; if (ma.phase === 'waiting') { ma.wait -= 0.1; if (ma.wait <= 0) { ma.phase = 'lit'; ma.side = Math.random() < 0.5 ? 'up' : 'down'; ma.left = 10; } } else { ma.left -= 0.1; if (ma.left <= 0) { ma.phase = 'waiting'; ma.wait = 5; ma.last = hm(Date.now()) + ' · ' + (ma.side === 'up' ? 'Up' : 'Down'); } }
  const rs = st.signals.rsi; if (rs.phase === 'waiting') { rs.wait -= 0.1; rs.value += (50 - rs.value) * 0.08 + (Math.random() - 0.5) * 3; if (rs.wait <= 0) { rs.phase = 'lit'; rs.side = Math.random() < 0.5 ? 'up' : 'down'; rs.left = 10; } } else { rs.left -= 0.1; const target = rs.side === 'up' ? 24 : 78; rs.value += (target - rs.value) * 0.25 + (Math.random() - 0.5) * 2; if (rs.left <= 0) { rs.phase = 'waiting'; rs.wait = 5; rs.last = hm(Date.now()) + ' · ' + (rs.side === 'up' ? 'Up' : 'Down'); } }

  if (st.risk.confirm > 0) { st.risk.confirm -= 0.1; if (st.risk.confirm <= 0) { st.risk.confirm = 0; } }

    if (p.stopOn && pnl <= -p.amount * p.stop / 100) ended = ended || [p, 'stop']; else if (p.tpOn && pnl >= p.amount * p.tp / 100) ended = ended || [p, 'tp']; else if (p.left <= 0) ended = ended || [p, 'timer']; });
  if (ended) { const [p, reason] = ended; const r = closeTrade(p, reason); if (st.screen === 'strategy' || st.screen === 'position') { st.result = r; go('result', false); return; } st.notice = { kind: 'info', text: `${NAMES[p.strategy]}: closed by ${reason === 'timer' ? 'timer' : reason === 'stop' ? 'stop' : 'take profit'} @ ${money(st.price)}, ${fmt(r.pnl)} while you were away` }; }
  // onboarding clocks
  if (st.screen === 'splash') { st.splash++; if (st.splash >= 15) return go('network', false); return render(); }
  if (st.screen === 'enable' && st.enable > 0) { st.enable++; if (st.enable >= 90) { st.enable = 90; return go('lobby', false); } return render(); }
  if (st.screen === 'money' && st.money === 'wait' && Math.random() < 0.005) { st.money = 'done'; render(); setTimeout(() => { if (st.money === 'done') { st.money = 'ready'; render(); } }, 2500); }
  patch();
}
