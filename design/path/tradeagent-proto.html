<title>TradeAgent Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
  /* Gray on purpose: the prototype checks order, words and feel, not the look. */
  :root { --ink: #18181B; --body: #3F3F46; --muted: #71717A; --line: #D4D4D8; --hair: #E4E4E7; --soft: #F4F4F5; --paper: #FFFFFF; --ground: #E9E9EC; --danger: #DC2626; --danger-soft: #FEE2E2; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #stage { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  #phone { width: 390px; height: 844px; max-width: 100%; background: var(--paper); border-radius: 36px; border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(24,24,27,0.18); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  @media (max-width: 480px) { #stage { padding: 0; align-items: stretch; } #phone { width: 100%; height: 100dvh; border-radius: 0; border: 0; box-shadow: none; } }
  #screen { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; -webkit-overflow-scrolling: touch; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  .num { font-variant-numeric: tabular-nums; }
  .ph { background: repeating-linear-gradient(135deg, #E4E4E7 0 6px, #F4F4F5 6px 12px); }
  [data-a] { cursor: pointer; user-select: none; -webkit-user-select: none; }
  [data-a]:active { opacity: 0.7; }
  .page { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 24px 28px; box-sizing: border-box; gap: 16px; }
  .top { display: flex; flex-direction: column; gap: 18px; }
  .bottom { display: flex; flex-direction: column; gap: 12px; }
  .h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .p { font-size: 16px; line-height: 1.45; color: #52525B; text-wrap: pretty; }
  .small { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .btn { height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; box-sizing: border-box; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.outline { border: 1px solid var(--ink); }
  .btn.disabled { background: var(--hair); color: #A1A1AA; }
  .btn.danger { background: var(--danger); color: #fff; }
  .link { height: 44px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; color: #52525B; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: var(--soft); }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--body); }
  .row b { font-weight: 600; color: var(--ink); }
  .badge { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); color: #52525B; white-space: nowrap; }
  .badge.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head .title { font-size: 15px; font-weight: 600; }
  .head .back { font-size: 14px; color: var(--muted); padding: 6px 0; }
  .head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .qmark { width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #52525B; }
  .pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); font-size: 13px; font-weight: 600; }
  .chip { padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); color: var(--body); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); flex-shrink: 0; }
  .term { border-bottom: 1px dashed #A1A1AA; }
  .toast { padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.4; }
  .toast.error { background: var(--danger-soft); }
  .updown { display: flex; gap: 12px; }
  .ud { flex: 1; height: 76px; border-radius: 16px; border: 2px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box; }
  .ud .l { font-size: 22px; font-weight: 700; }
  .ud .s { font-size: 12px; color: var(--muted); }
  .ud.fill { background: var(--ink); color: #fff; }
  .ud.fill .s { color: #D4D4D8; }
  .dim { opacity: 0.4; pointer-events: none; }
  .sheetbg { position: absolute; inset: 0; background: rgba(24,24,27,0.35); display: flex; align-items: flex-end; }
  .sheet { width: 100%; border-radius: 20px 20px 0 0; background: #fff; padding: 20px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 22px; height: 4px; border-radius: 2px; background: var(--hair); }
  .dot.on { background: var(--ink); }
  .list > div { padding: 10px 0; border-bottom: 1px solid var(--hair); }
  .toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--hair); position: relative; flex-shrink: 0; transition: background .15s; }
  .toggle.on { background: var(--ink); }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 10px; background: #fff; transition: transform .15s; }
  .toggle.on::after { transform: translateX(18px); }
  input[type=number] { font: inherit; font-size: 32px; font-weight: 700; letter-spacing: -0.01em; border: 0; outline: 0; width: 120px; background: transparent; color: var(--ink); padding: 0; }
  input[type=range] { width: 100%; accent-color: var(--ink); }
  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper div[data-a] { width: 32px; height: 32px; border-radius: 16px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .pinned { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--hair); margin: 8px -20px 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .footer-links { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .footer-links div[data-a] { padding: 6px 0; }
  .focus:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #note { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 10; }
  #note.show { opacity: 1; }
  #tools { position: fixed; top: 10px; right: 12px; display: flex; gap: 6px; z-index: 9; }
  #tools div { padding: 6px 10px; border-radius: 8px; background: rgba(24,24,27,0.8); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  @media (max-width: 480px) { #tools { top: auto; bottom: 10px; right: 10px; opacity: 0.85; } }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(24,24,27,0.35); } 50% { box-shadow: 0 0 0 8px rgba(24,24,27,0); } }
  @keyframes slide { from { background-position: 0 0; } to { background-position: 40px 0; } }
  .pulse { animation: pulse 1.2s ease-out infinite; }
  .busy { background-image: repeating-linear-gradient(90deg, #18181B 0 12px, #52525B 12px 20px); background-size: 40px 6px; animation: slide 0.8s linear infinite; }
  .menu { position: absolute; top: 36px; left: 38px; width: 250px; border-radius: 14px; background: #fff; border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(24,24,27,0.16); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 2; }
  .menu > div { padding: 10px 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="stage"><div id="phone"><div id="screen"></div><div id="overlay"></div></div></div>
<div id="tools"><div data-a="reset">Restart</div></div>
<div id="note"></div>

<script>
'use strict';
// ---------------------------------------------------------------- state
const TICK = 100;                 // ms
const MINUTES_PER_45S = 15;       // the prototype compresses a 15-minute horizon into 45 s
const FEE_BPS = 3.45;             // round trip, taker, both legs
const MARKET = { symbol: 'BTC', maxLev: 15 };
const NAMES = { direction: 'Direction', ma: 'MA Cross', rsi: 'RSI Bounce' };
const el = (id) => document.getElementById(id);
let st;

function fresh() {
  const now = Date.now();
  return {
    mode: 'start', screen: 'start', stack: [],
    network: 'testnet', firstVisit: true, intro: 0, splash: 0, dialog: false, money: 'pick', enable: 0, lessonSeen: {},
    settings: { size: 750, lev: MARKET.maxLev, stopOn: false, stop: 50, tpOn: false, tp: 50, horizon: 15 },
    strategy: 'direction', chart: 'candles', tf: '1m', contextOpen: false, historyTab: 'positions', historyFilter: 'all', netMenu: false, moneyFrom: 'base',
    price: 61250, prices: Array.from({ length: 80 }, (_, i) => 61250 + Math.sin(i / 6) * 120 + (i % 7) * 9),
    signals: { ma: { phase: 'waiting', side: 'up', left: 0, wait: 5, last: '11:20 · Up' }, rsi: { phase: 'waiting', side: 'up', left: 0, wait: 5, value: 52, last: '09:48 · Up', series: Array.from({ length: 80 }, (_, i) => 50 + Math.sin(i / 5) * 12) } },
    positions: [], cooldown: {}, budgetSpent: 0, notice: null,
    trades: [
      { id: 't4', strategy: 'direction', side: 'up', entry: 61250, exit: 61396, amount: 50, lev: 15, opened: now - 3 * 3600e3, closed: now - 3 * 3600e3 + 15 * 60e3, reason: 'timer', pnl: 1.04, fees: 0.26, worst: -3.1, best: 2.4 },
      { id: 't3', strategy: 'ma', side: 'down', entry: 61480, exit: 61510, amount: 50, lev: 15, opened: now - 6 * 3600e3, closed: now - 6 * 3600e3 + 4 * 60e3, reason: 'manual', pnl: -0.42, fees: 0.26, worst: -1.2, best: 0.3 },
      { id: 't2', strategy: 'direction', side: 'up', entry: 60900, exit: 60720, amount: 50, lev: 15, opened: now - 20 * 3600e3, closed: now - 20 * 3600e3 + 9 * 60e3, reason: 'stop', pnl: -25, fees: 0.26, worst: -25, best: 0.8 },
      { id: 't1', strategy: 'rsi', side: 'up', entry: 60400, exit: 60610, amount: 50, lev: 15, opened: now - 26 * 3600e3, closed: now - 26 * 3600e3 + 15 * 60e3, reason: 'timer', pnl: 1.66, fees: 0.26, worst: -0.6, best: 2.9 },
    ],
    result: null, lesson: { name: 'direction', step: 0, answer: null }, board: 'direction', prize: 1.2, claiming: false,
    risk: { confirm: 0 }, sheet: null, withdraw: { stage: 'pick', dest: 'chain', amount: 50 }, streak: 3, analysisSeen: false, boardPeriod: 'week',
  };
}

// ---------------------------------------------------------------- helpers
const fmt = (n, d = 2) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(d);
const money = (n) => Math.round(n).toLocaleString('en-US').replace(/,/g, ' ');
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const hm = (t) => { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const testnet = () => st.network === 'testnet';
const badge = (long = false) => testnet() ? `<div class="badge">${long ? 'TESTNET · TEST MONEY' : 'TESTNET'}</div>` : '';
const balance = () => (testnet() ? 10001 : 101) + st.trades.reduce((a, t) => a + (t.id.startsWith('n') ? t.pnl : 0), 0);
const put = () => st.settings.size / st.settings.lev;
const risk = () => { const s = st.settings; return s.stopOn ? put() * s.stop / 100 : put(); };
const possible = () => { const s = st.settings; const win = s.tpOn ? `+${(put() * s.tp / 100).toFixed(2)} · at +${s.tp}%` : `+${(s.size / 100).toFixed(2)} per 1% of BTC · no cap`; return `<div id="possible" style="display:flex;gap:8px"><div class="card" style="flex:1;gap:2px;padding:12px 14px"><div class="small" style="font-size:11px;font-weight:600;letter-spacing:.04em">POSSIBLE WIN</div><div class="num" style="font-size:15px;font-weight:700">${win}</div></div><div class="card" style="flex:1;gap:2px;padding:12px 14px"><div class="small" style="font-size:11px;font-weight:600;letter-spacing:.04em">POSSIBLE LOSS</div><div class="num" style="font-size:15px;font-weight:700">−${risk().toFixed(2)} at most</div></div></div>`; };
const ANALYSIS = { headline: 'Whales bought the dip this morning; retail is still selling.', flows: 'buys $4.2M · sells $2.9M', lean: 'buyers ahead', who: 'Buying: Wintermute $1.1M, 0x9a…f2 $640K · Selling: Jump $780K', strategies: 'A trend day: crosses paid 3 of 4 so far, RSI zones came once. MA Cross fits today better than RSI.' };
const notionalOf = (p) => p.amount * p.lev;
const pnlOf = (p) => { const move = st.price / p.entry - 1; return notionalOf(p) * (p.side === 'up' ? move : -move) - notionalOf(p) * FEE_BPS / 10000; };
const openPos = (s = st.strategy) => st.positions.find((p) => p.strategy === s) || null;
const note = (t) => { const n = el('note'); n.textContent = t; n.classList.add('show'); clearTimeout(note.t); note.t = setTimeout(() => n.classList.remove('show'), 1600); };
const go = (screen, push = true) => { if (push && st.screen !== screen) st.stack.push(st.screen); st.screen = screen; st.sheet = null; render(); el('screen').scrollTop = 0; };
const back = () => { st.screen = st.stack.pop() || 'lobby'; st.sheet = null; render(); };
const term = (t, k) => `<span class="term" data-a="term" data-v="${k}">${t}</span>`;
const share = () => `<div class="pill" data-a="sheet" data-v="share"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 15V3"></path><path d="M8 7l4-4 4 4"></path></svg>Share</div>`;

const TERMS = () => ({
  lev: ['Leverage', `A ${st.settings.size} AUSD position at ${st.settings.lev}x takes ${put().toFixed(0)} AUSD of your own. A 1% move in Bitcoin is ${(st.settings.size / 100).toFixed(2)} AUSD for you, up or down. The stop keeps the downside capped.`],
  stop: ['Stop', 'Closes the trade when it has lost the share you set. That is the most one tap can lose.'],
  tp: ['Take profit', 'Optional. Closes the trade when it has won the amount you set, before the time runs out.'],
  horizon: ['Time limit', 'The trade closes on its own when the time runs out, whatever the price. You never have to remember to close.'],
});

// ---------------------------------------------------------------- screens
const V = {};

V.start = () => `<div class="page"><div class="top">
  <div style="display:flex;align-items:center;gap:10px"><div class="mark"></div><div style="font-size:15px;font-weight:600">TradeAgent · prototype</div></div>
  <div class="h1">Two things to click through</div>
  <div class="p">Gray on purpose. Everything works, nothing is real: the price is a random walk, 15 minutes take 45 seconds, the money is fake.</div>
  <div class="card" data-a="mode" data-v="onboarding"><div style="font-size:18px;font-weight:700">Onboarding</div><div class="small">Splash → practice or real → intro → passkey → open account → lobby → lesson → first tap → position → result. Continues into the app.</div></div>
  <div class="card" data-a="mode" data-v="app"><div style="font-size:18px;font-weight:700">The app</div><div class="small">Returning user with a history. Lobby, three strategies, position settings, live positions, leaderboard with a prize to claim, history, risk board, account and withdraw, lessons, the own-strategy stub. Test clock: MA Cross and RSI signal every 5 s for 10 s.</div></div>
</div><div class="small" style="text-align:center">«Restart» in the corner brings you back here.</div></div>`;

V.splash = () => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#18181B;color:#fff">
  <div style="width:72px;height:72px;border-radius:20px;background:#fff"></div><div style="font-size:22px;font-weight:700">TradeAgent</div>
  <div style="width:120px;height:3px;border-radius:2px;background:#3F3F46;overflow:hidden"><div style="height:3px;width:${Math.min(100, st.splash * 100 / 15)}%;background:#fff"></div></div></div>`;

V.network = () => `<div class="page"><div class="top">
  <div class="h1">How do you want to start?</div>
  <div class="card" data-a="net" data-v="testnet" style="border:2px solid var(--ink);background:#FAFAFA;gap:8px"><div class="head"><div style="font-size:19px;font-weight:700">Practice</div><div class="right"><div class="badge">⬡ MONAD TESTNET</div></div></div><div style="font-size:15px;line-height:1.4;color:var(--body)">Practice money from the exchange. Real prices, real strategies, nothing to lose.</div></div>
  <div class="card" data-a="net" data-v="mainnet" style="border:1px solid var(--line);background:#FAFAFA;gap:8px"><div class="head"><div style="font-size:19px;font-weight:700">Real money</div><div class="right"><div class="badge dark">⬡ MONAD MAINNET</div></div></div><div style="font-size:15px;line-height:1.4;color:var(--body)">Your own money on a real exchange. You deposit it, every win and loss is real, and you can withdraw any time.</div></div>
</div><div class="small" style="text-align:center">You can switch any time in Account.</div></div>`;

const INTRO = [
  ['Be the smartest one in the market', 'Join the 0.01% who trade with AI and real strategies. Everyone else is at the casino.'],
  ['Your trading copilot', 'Not a wealth button. A tool that makes you a sharper trader: strategies to follow, then your own to build, skills that compound.'],
  ['This is where you get good', 'A plan on every trade, a stop, a daily budget. A streak to protect, a board to climb. Discipline you can feel in a week.'],
];
V.intro = () => { const [t, b] = INTRO[st.intro]; return `<div class="page"><div class="top">
  <div class="head"><div class="mark" style="width:22px;height:22px;border-radius:6px"></div><div class="title">TradeAgent</div>${badge()}<div class="right"><div class="small" data-a="go" data-v="passkey">Skip</div></div></div>
  <div class="ph" style="height:250px;border-radius:20px"></div>
  <div class="dots">${INTRO.map((_, i) => `<div class="dot ${i <= st.intro ? 'on' : ''}"></div>`).join('')}</div>
  <div class="h1" style="font-size:30px">${t}</div><div class="p" style="font-size:17px;color:var(--body)">${b}</div>
</div><div class="bottom"><div class="btn primary" data-a="introNext">${st.intro < 2 ? 'Next' : "Let's go"}</div></div></div>`; };

V.passkey = () => `<div class="page"><div class="top">
  <div style="width:64px;height:64px;border-radius:16px;border:1px solid var(--line)"></div>
  <div class="h1">Your account is a passkey</div>
  <div class="p">No password, no seed phrase. The key is created on this device and Face ID unlocks it. Nobody else, including us, can withdraw.</div>
</div><div class="bottom"><div class="btn primary" data-a="dialog">Create account</div><div class="link" data-a="dialog">I already have one · Sign in</div></div></div>`;

V.realmoney = () => `<div class="page"><div class="top">
  <div class="h1">This is real money</div>
  <div class="p">Trades here use real dollars on a real exchange. A losing trade loses money. Every trade has a stop, and you never risk more than the screen says.</div>
  <div class="card" style="font-size:14px;color:var(--body)"><div>· Your first trade risks at most 25 AUSD</div><div>· You can close any trade at any moment</div><div>· One button closes everything</div></div>
</div><div class="bottom"><div class="btn primary" data-a="go" data-v="money">I understand</div>${st.mode === 'app' ? `<div class="link" data-a="back">Stay on practice</div>` : ''}</div></div>`;

V.money = () => { const m = st.money; return `<div class="page"><div class="top">
  <div class="h1">Add funds</div><div class="p">Send from any chain or exchange. It arrives in your account as AUSD, a dollar stablecoin.</div>
  ${m === 'pick' ? `<div><div class="small">From</div><div class="chips" style="margin-top:8px">${['monad', 'base', 'arbitrum', 'ethereum'].map((c) => `<div class="chip ${st.moneyFrom === c ? 'on' : ''}" data-a="moneyfrom" data-v="${c}">${c[0].toUpperCase() + c.slice(1)}</div>`).join('')}</div></div>
    ${st.moneyFrom === 'monad' ? `<div class="card"><div class="small">Send AUSD on Monad to your address</div><div class="num" style="font-size:15px;font-weight:600;word-break:break-all">0x3f9a 2c41 8b7e d0f5 6a1c 93e2 47b8 c5d1 0a4f e6b2</div><div style="display:flex;gap:8px"><div class="chip" data-a="note" data-v="Copied">Copy</div><div class="chip" data-a="note" data-v="QR: not in the prototype">QR</div></div></div><div class="small">No bridge, no swap: it lands in a minute. Minimum 100 AUSD to open the account.</div>` : `<div><div class="small">Asset and amount</div><div style="display:flex;gap:8px;align-items:center;margin-top:8px"><div class="chip on">USDC</div><div class="chip">ETH</div><div class="num" style="margin-left:auto;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:16px;min-width:80px;text-align:right">100</div></div><div class="small" style="margin-top:8px">Minimum 100. The exchange needs it to open your account.</div></div>`}`
  : m === 'wait' ? `<div class="card"><div class="small">Send 100 USDC on Base to</div><div class="num" style="font-size:15px;font-weight:600;word-break:break-all">0x3f9a 2c41 8b7e d0f5 6a1c 93e2 47b8 c5d1 0a4f e6b2</div><div class="chip" style="align-self:flex-start" data-a="note" data-v="Copied">Copy</div></div><div class="small">Waiting for your transfer. Usually under two minutes.</div>`
  : m === 'done' ? `<div class="card"><div class="small">Arrived</div><div class="num" style="font-size:28px;font-weight:700">100 AUSD</div></div><div class="small">Preparing your account… a few seconds.</div>`
  : `<div class="card"><div class="small">Arrived</div><div class="num" style="font-size:28px;font-weight:700">100 AUSD</div></div>`}

function openTrade(side) {
  const s = st.settings; if (s.size < 5) return note('Minimum is 5 AUSD');
  if (put() > balance()) return note('Not enough balance for this size');
  const total = s.horizon * 60;
  st.positions.push({ strategy: st.strategy, side, entry: st.price, amount: put(), lev: s.lev, stopOn: s.stopOn, stop: s.stop, tpOn: s.tpOn, tp: s.tp, total, left: total, opened: Date.now(), worst: 0, best: 0 });
  st.notice = null; st.firstVisit = false; go('strategy', false);
}
function closeTrade(p, reason) {
  const pnl = pnlOf(p), fees = notionalOf(p) * FEE_BPS / 10000, move = (st.price / p.entry - 1) * 100 * (p.side === 'up' ? 1 : -1);
  st.positions = st.positions.filter((x) => x !== p); st.cooldown[p.strategy] = 6; if (pnl < 0) st.budgetSpent += -pnl;
  const elapsed = p.total - p.left; const dur = elapsed < 60 ? 'under a minute' : Math.round(elapsed / 60) + ' min';
  st.trades.unshift({ id: 'n' + Date.now(), strategy: p.strategy, side: p.side, entry: p.entry, exit: st.price, amount: p.amount, lev: p.lev, opened: p.opened, closed: Date.now(), reason, pnl, fees, worst: Math.min(p.worst, pnl), best: Math.max(p.best, pnl), stopOn: p.stopOn, stop: p.stop, tpOn: p.tpOn, tp: p.tp });
  return { pnl, fees, move, dur, reason, strategy: p.strategy };
}

  setsize: (v) => { st.settings.size = Number(v); render(); },

  addfunds: () => { st.money = 'pick'; go('money'); },

  netmenu: () => { st.netMenu = !st.netMenu; render(); },

// ---------------------------------------------------------------- the clock
function tick() {
  // the market: a random walk, one step a tick
  st.price = st.price * (1 + (Math.random() - 0.5) * 0.0008); if (Math.random() < 0.2) { st.prices.push(st.price); st.prices.shift(); st.signals.rsi.series.push(st.signals.rsi.value); st.signals.rsi.series.shift(); }
  // signals: MA lights up now and then; RSI drifts and lights up in a zone
  const ma = st.signals.ma; if (ma.phase === 'waiting') { ma.wait -= 0.1; if (ma.wait <= 0) { ma.phase = 'lit'; ma.side = Math.random() < 0.5 ? 'up' : 'down'; ma.left = 10; } } else { ma.left -= 0.1; if (ma.left <= 0) { ma.phase = 'waiting'; ma.wait = 5; ma.last = hm(Date.now()) + ' · ' + (ma.side === 'up' ? 'Up' : 'Down'); } }
  const rs = st.signals.rsi; if (rs.phase === 'waiting') { rs.wait -= 0.1; rs.value += (50 - rs.value) * 0.08 + (Math.random() - 0.5) * 3; if (rs.wait <= 0) { rs.phase = 'lit'; rs.side = Math.random() < 0.5 ? 'up' : 'down'; rs.left = 10; } } else { rs.left -= 0.1; const target = rs.side === 'up' ? 24 : 78; rs.value += (target - rs.value) * 0.25 + (Math.random() - 0.5) * 2; if (rs.left <= 0) { rs.phase = 'waiting'; rs.wait = 5; rs.last = hm(Date.now()) + ' · ' + (rs.side === 'up' ? 'Up' : 'Down'); } }
  Object.keys(st.cooldown).forEach((k) => { if (st.cooldown[k] > 0) st.cooldown[k] = Math.max(0, st.cooldown[k] - 0.1); });
  if (st.risk.confirm > 0) { st.risk.confirm -= 0.1; if (st.risk.confirm <= 0) { st.risk.confirm = 0; } }
  // positions: countdown compressed, stops and take profits judged on every tick
  let ended = null;
  st.positions.forEach((p) => { p.left -= (p.total / (45 * 10)); const pnl = pnlOf(p); p.worst = Math.min(p.worst, pnl); p.best = Math.max(p.best, pnl);
    if (p.stopOn && pnl <= -p.amount * p.stop / 100) ended = ended || [p, 'stop']; else if (p.tpOn && pnl >= p.amount * p.tp / 100) ended = ended || [p, 'tp']; else if (p.left <= 0) ended = ended || [p, 'timer']; });
  if (ended) { const [p, reason] = ended; const r = closeTrade(p, reason); if (st.screen === 'strategy' || st.screen === 'position') { st.result = r; go('result', false); return; } st.notice = { kind: 'info', text: `${NAMES[p.strategy]}: closed by ${reason === 'timer' ? 'timer' : reason === 'stop' ? 'stop' : 'take profit'} @ ${money(st.price)}, ${fmt(r.pnl)} while you were away` }; }
  // onboarding clocks
  if (st.screen === 'splash') { st.splash++; if (st.splash >= 15) return go('network', false); return render(); }
  if (st.screen === 'enable' && st.enable > 0) { st.enable++; if (st.enable >= 90) { st.enable = 90; return go('lobby', false); } return render(); }
  if (st.screen === 'money' && st.money === 'wait' && Math.random() < 0.005) { st.money = 'done'; render(); setTimeout(() => { if (st.money === 'done') { st.money = 'ready'; render(); } }, 2500); }
  patch();
}
st = fresh(); render(); setInterval(tick, TICK);
