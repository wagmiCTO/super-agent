openapi: 3.1.0
info:
  title: Platform API
  version: 0.1.0
  description: |
    The contract between the app and the trading service (`services/cmd/platform`).

    Every amount is a **decimal string**, never a JSON number: numbers are floats
    on the receiving side and money is not. Parse with a decimal type.

    Every order passes through the policy engine before it reaches the venue.
    A refusal is a `403` carrying a stable machine-readable `error` code, the
    limit that was hit and the value that hit it, so the app can say
    "you asked for 200, the limit is 100" rather than "something went wrong".

servers:
  - url: http://127.0.0.1:8080
    description: local development

paths:
  /v1/health:
    get:
      summary: Liveness
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, const: ok } }

  /v1/markets:
    get:
      summary: Tradable markets with the fee schedule that applies to this account
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Market" }

  /v1/state:
    get:
      summary: Account balance, open positions, limits in force and how much of them is used
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }

  /v1/orders/open:
    post:
      summary: Open a position
      description: |
        Sized by notional in collateral units; the service derives the size
        from the venue's mark price. Returns once the venue accepted or refused
        the order — fills may still be in flight for a resting order, but a
        market order is filled on return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenRequest" }
      responses:
        "200":
          description: >-
            Accepted by the venue. Check `status`: a venue-side failure arrives
            here with status `failed` and a `rejection`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/VenueRejected" }

  /v1/orders/close:
    post:
      summary: Close the open position in a market
      description: |
        The service sizes the close from the venue's own position, never from
        the caller. Closing is never refused by the policy engine.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/VenueRejected" }

  /v1/exchange/enroll/payload:
    post:
      summary: Start enrolling an exchange API key for a wallet
      description: |
        The platform generates an Ed25519 key pair and asks the venue for two
        things: the wallet's sign-in message, and the EIP-712 document that
        binds the new key to the wallet and to our builder terms. The wallet
        signs both — `sign_in_message` as a personal message (EIP-191),
        `typed_data` as EIP-712. `statement` is the prose the user reads. The
        private key waits on the server until `expires_at`.

        The sign-in is what creates the wallet's profile at the venue on first
        contact; without it the venue refuses to enroll a key.

        When signing with viem, pass `domain.chainId` as a **bigint**: given a
        string, viem drops chainId from the domain type and the venue rejects
        the signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: The wallet the key is for, 0x-hex. }
                label: { type: string, description: Shown on the venue's key page. }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollPayload" }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/VenueRejected" }
        "503":
          description: No builder code configured; enrollment is unavailable.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/exchange/enroll:
    post:
      summary: Finish enrolling with the wallet's signature
      description: |
        The platform signs the wallet in at the venue with `sign_in_signature`
        (creating its profile on first contact), then computes the EIP-712
        digest, signs it with the pending Ed25519 key as proof of possession,
        and submits it with `signature`. On success the key is stored and the
        platform can trade for this wallet. A handle is single-use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle, sign_in_signature, signature]
              properties:
                handle: { type: string }
                sign_in_signature: { type: string, description: The wallet's EIP-191 signature over sign_in_message, 0x-hex, 65 bytes. }
                signature: { type: string, description: The wallet's EIP-712 signature over typed_data, 0x-hex, 65 bytes. }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolledKey" }
        "400": { $ref: "#/components/responses/Invalid" }
        "422": { $ref: "#/components/responses/VenueRejected" }

  /v1/exchange/key:
    get:
      summary: The enrolled key for a wallet, without secrets
      parameters:
        - in: query
          name: address
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrolledKey" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/exchange/network:
    get:
      summary: Where a wallet opens its exchange account on-chain
      description: >-
        An enrolled key only authorizes API access. To trade, the wallet itself
        must create an exchange account with collateral and allow order
        forwarding: approve(exchange_address, amount) on collateral_token, then
        createAccount(amount) and allowOrderForwarding(true) on
        exchange_address, with amount ≥ min_account_open_raw. The platform
        never holds a key that could send these.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangeNetwork" }
        "503":
          description: No builder code configured; enrollment is unavailable.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/signals/ma-cross:
    get:
      summary: The MA Cross signal for a market
      description: >-
        The strategy's signal, shared by everyone: closed one-minute bars with
        the fast and slow averages, which average is on top, and — for a few
        minutes after a cross — an open window inviting an entry in the
        cross's direction. The signal never places orders; the user does.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string, example: MON }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MACrossSignal" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: No signals are running.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/signals/rsi:
    get:
      summary: The RSI signal for a market
      description: >-
        Wilder's RSI over closed one-minute bars with the oversold and
        overbought zones. A bar closing with the index entering the oversold
        zone opens a window up; entering overbought opens a window down.
      parameters:
        - in: query
          name: symbol
          required: true
          schema: { type: string, example: MON }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RSISignal" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/candles:
    get:
      summary: OHLCV history for a market, for the chart
      parameters:
        - { in: query, name: symbol, required: true, schema: { type: string, example: MON } }
        - { in: query, name: period_seconds, required: true, schema: { type: integer, example: 60 } }
        - { in: query, name: from, required: true, schema: { type: integer, description: Unix seconds, inclusive. } }
        - { in: query, name: to, required: true, schema: { type: integer, description: Unix seconds. } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Candle" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/prizes:
    get:
      summary: A wallet's published prizes and whether each was claimed
      parameters:
        - { in: query, name: address, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [contract, prizes, weeks]
                properties:
                  contract: { type: string }
                  prizes:
                    type: array
                    items: { $ref: "#/components/schemas/PrizeWinner" }
                  weeks:
                    type: array
                    items: { type: integer }
                    description: The week index of each prize, in the same order.
        "503":
          description: No prize pool configured.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/trades:
    get:
      summary: The account's round trips in a market, newest first
      description: What the chart marks — entries, exits and the open position. Routed by X-Account-Address like the rest of the account.
      parameters:
        - { in: query, name: symbol, required: true, schema: { type: string, example: MON } }
        - { in: query, name: limit, required: false, schema: { type: integer, default: 50, maximum: 500 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trade" }

  /v1/leaderboard:
    get:
      summary: This week's board for every strategy
      description: >-
        One board per strategy, in lobby order: what the strategy made for
        everyone this week, how many played, how many hold a position right
        now, and the top wallets. Weeks start Monday 00:00 UTC.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }

  /v1/kill:
    post:
      summary: Engage the kill switch — stops all opening, closing stays allowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  killed: { type: boolean, const: true }
                  reason: { type: string }

  /v1/revive:
    post:
      summary: Release the kill switch
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties: { killed: { type: boolean, const: false } }

components:
  schemas:
    Decimal:
      type: string
      description: Decimal number as a string, e.g. "20.5". Never a JSON number.
      pattern: '^-?[0-9]+(\.[0-9]+)?$'

    Side:
      type: string
      enum: [long, short]

    OrderStatus:
      type: string
      enum: [unknown, pending, open, partially-filled, filled, canceled, expired, failed]

    Market:
      type: object
      required: [symbol, max_leverage, price_tick, size_step, order_ttl_seconds, fees]
      properties:
        symbol: { type: string, example: MON }
        max_leverage: { $ref: "#/components/schemas/Decimal" }
        liquidation_leverage: { $ref: "#/components/schemas/Decimal" }
        price_tick: { $ref: "#/components/schemas/Decimal" }
        size_step: { $ref: "#/components/schemas/Decimal" }
        order_ttl_seconds:
          type: number
          description: How long an order may live on this venue. 0 means unlimited.
        fees: { $ref: "#/components/schemas/Fees" }

    Fees:
      type: object
      required: [maker_rate, taker_rate, builder_rate, charged_on, posting_fee, round_trip_taker, round_trip_taker_bps, break_even_move_taker]
      description: Rates are fractions of notional ("0.00069" is 6.9 bps).
      properties:
        maker_rate: { $ref: "#/components/schemas/Decimal" }
        taker_rate: { $ref: "#/components/schemas/Decimal" }
        builder_rate: { $ref: "#/components/schemas/Decimal" }
        charged_on:
          type: string
          enum: [open-only, every-fill]
          description: Whether the venue charges only the opening fill or every fill.
        posting_fee:
          $ref: "#/components/schemas/Decimal"
          description: Flat charge per resting order, in collateral units.
        round_trip_taker:
          $ref: "#/components/schemas/Decimal"
          description: Total fee fraction for open + close as taker. Use this, never taker_rate × 2.
        round_trip_taker_bps: { $ref: "#/components/schemas/Decimal" }
        break_even_move_taker:
          $ref: "#/components/schemas/Decimal"
          description: Price move fraction needed to cover the round trip. Independent of leverage.

    Account:
      type: object
      required: [id, balance, locked, can_trade, frozen, fee_tier, status]
      properties:
        id:
          type: string
          description: Venue account id; "0" when the wallet has no exchange account yet.
        balance: { $ref: "#/components/schemas/Decimal" }
        locked: { $ref: "#/components/schemas/Decimal" }
        can_trade:
          type: boolean
          description: False until the venue-side permission to trade through the API is granted.
        frozen: { type: boolean }
        fee_tier: { type: integer }
        status:
          type: string
          enum: [no_exchange_account, forwarding_disabled, frozen, active]
          description: >-
            Why can_trade is false. no_exchange_account — the wallet must fund and
            create its exchange account on-chain; forwarding_disabled — the account
            exists but has not allowed API order forwarding; frozen — the venue froze
            the account; active — ready to trade.

    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: integer, description: Bar open time, unix seconds. }
        o: { $ref: "#/components/schemas/Decimal" }
        h: { $ref: "#/components/schemas/Decimal" }
        l: { $ref: "#/components/schemas/Decimal" }
        c: { $ref: "#/components/schemas/Decimal" }
        v: { $ref: "#/components/schemas/Decimal" }

    Leaderboard:
      type: object
      required: [week_start, source, boards]
      properties:
        week_start: { type: string, format: date-time }
        source:
          type: string
          enum: [journal, memory]
          description: journal when the boards come from the platform's database; memory when from the process alone.
        prize:
          $ref: "#/components/schemas/Prize"
        boards:
          type: array
          items: { $ref: "#/components/schemas/Board" }

    Trade:
      type: object
      required: [strategy, symbol, side, size, entry_price, opened_at]
      properties:
        strategy: { type: string }
        symbol: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        size: { $ref: "#/components/schemas/Decimal" }
        entry_price: { $ref: "#/components/schemas/Decimal" }
        exit_price: { $ref: "#/components/schemas/Decimal" }
        pnl: { $ref: "#/components/schemas/Decimal" }
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, description: Absent while the position is open. }

    Prize:
      type: object
      description: The on-chain weekly prize pool (StrategyPrizePool), when configured.
      required: [contract, token, week, pools, last_week, winners]
      properties:
        contract: { type: string }
        token: { type: string, description: The collateral token the pool holds. }
        week: { type: integer, description: This week's index (Monday-aligned weeks since epoch). }
        pools:
          type: array
          items:
            type: object
            required: [strategy, pool]
            properties:
              strategy: { type: string }
              pool: { $ref: "#/components/schemas/Decimal" }
        last_week: { type: integer }
        winners:
          type: array
          description: Last week's published winners, best first per strategy.
          items: { $ref: "#/components/schemas/PrizeWinner" }

    PrizeWinner:
      type: object
      required: [strategy, wallet, amount, pnl, claimed]
      properties:
        strategy: { type: string }
        wallet: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        pnl: { $ref: "#/components/schemas/Decimal" }
        claimed: { type: boolean }

    Board:
      type: object
      required: [id, name, tagline, rhythm, pnl, players, trades, active_now, top]
      properties:
        id: { type: string, example: ma-cross }
        name: { type: string }
        tagline: { type: string, description: What the strategy is, in one line. }
        rhythm: { type: string, description: How often it asks for a decision. }
        pnl:
          $ref: "#/components/schemas/Decimal"
          description: What the strategy made for all its players this week, fees included.
        players: { type: integer }
        trades: { type: integer }
        active_now: { type: integer, description: Wallets holding a position under this strategy. }
        top:
          type: array
          items:
            type: object
            required: [wallet, pnl, trades]
            properties:
              wallet: { type: string }
              pnl: { $ref: "#/components/schemas/Decimal" }
              trades: { type: integer }

    RSISignal:
      type: object
      required: [symbol, period_seconds, length, oversold, overbought, ready, value, forming, points]
      properties:
        symbol: { type: string }
        period_seconds: { type: integer }
        length: { type: integer }
        oversold: { $ref: "#/components/schemas/Decimal" }
        overbought: { $ref: "#/components/schemas/Decimal" }
        ready: { type: boolean }
        value:
          $ref: "#/components/schemas/Decimal"
          description: The index as of the last closed bar, 0..100.
        forming: { type: boolean }
        window:
          type: object
          required: [side, opened_at, expires_at]
          properties:
            side: { $ref: "#/components/schemas/Side" }
            opened_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
        last_cross:
          type: object
          required: [side, at, value]
          properties:
            side: { $ref: "#/components/schemas/Side" }
            at: { type: string, format: date-time }
            value: { $ref: "#/components/schemas/Decimal" }
        points:
          type: array
          items:
            type: object
            required: [at, close]
            properties:
              at: { type: string, format: date-time }
              close: { $ref: "#/components/schemas/Decimal" }
              value: { $ref: "#/components/schemas/Decimal" }

    MACrossSignal:
      type: object
      required: [symbol, period_seconds, fast, slow, ready, trend, forming, points]
      properties:
        symbol: { type: string }
        period_seconds: { type: integer }
        fast: { type: integer, description: Fast average length, in bars. }
        slow: { type: integer, description: Slow average length, in bars. }
        ready: { type: boolean, description: False until slow closed bars exist. }
        trend:
          type: string
          enum: [up, down, flat]
          description: Which average is on top as of the last closed bar.
        forming:
          type: boolean
          description: Whether the last point is the bar still forming.
        window:
          type: object
          description: Present while an entry is offered after a cross.
          required: [side, opened_at, expires_at]
          properties:
            side: { $ref: "#/components/schemas/Side" }
            opened_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
        last_cross:
          type: object
          required: [side, at]
          properties:
            side: { $ref: "#/components/schemas/Side" }
            at: { type: string, format: date-time }
        points:
          type: array
          items:
            type: object
            required: [at, open, high, low, close]
            properties:
              at: { type: string, format: date-time }
              open: { $ref: "#/components/schemas/Decimal" }
              high: { $ref: "#/components/schemas/Decimal" }
              low: { $ref: "#/components/schemas/Decimal" }
              close: { $ref: "#/components/schemas/Decimal" }
              fast: { $ref: "#/components/schemas/Decimal" }
              slow: { $ref: "#/components/schemas/Decimal" }

    LastClose:
      type: object
      description: The most recent round trip's outcome, so the screen can say a position was closed while the user was away.
      required: [symbol, side, reason, price, pnl, at]
      properties:
        symbol: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        reason:
          type: string
          enum: [manual, horizon]
        price: { $ref: "#/components/schemas/Decimal" }
        pnl: { $ref: "#/components/schemas/Decimal" }
        at: { type: string, format: date-time }

    Position:
      type: object
      required: [id, symbol, side, size, entry_price, notional, collateral, leverage, unrealized_pnl, fees_paid]
      properties:
        id: { type: string }
        symbol: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        size: { $ref: "#/components/schemas/Decimal" }
        entry_price: { $ref: "#/components/schemas/Decimal" }
        notional: { $ref: "#/components/schemas/Decimal" }
        collateral: { $ref: "#/components/schemas/Decimal" }
        leverage: { $ref: "#/components/schemas/Decimal" }
        unrealized_pnl: { $ref: "#/components/schemas/Decimal" }
        fees_paid: { $ref: "#/components/schemas/Decimal" }
        opened_at: { type: string, format: date-time }
        closes_at:
          type: string
          format: date-time
          description: When the horizon closes this position; absent without one.

    Limits:
      type: object
      required: [allowed_symbols, min_notional, max_notional, max_leverage, max_total_exposure, max_open_positions, daily_loss, cooldown_seconds]
      properties:
        allowed_symbols: { type: array, items: { type: string } }
        min_notional: { $ref: "#/components/schemas/Decimal" }
        max_notional: { $ref: "#/components/schemas/Decimal" }
        max_leverage: { $ref: "#/components/schemas/Decimal" }
        max_total_exposure: { $ref: "#/components/schemas/Decimal" }
        max_open_positions: { type: integer }
        daily_loss: { $ref: "#/components/schemas/Decimal" }
        cooldown_seconds: { type: number }

    Risk:
      type: object
      required: [open_positions, exposure, daily_loss]
      description: How much of the limits is currently used.
      properties:
        open_positions: { type: integer }
        exposure: { $ref: "#/components/schemas/Decimal" }
        daily_loss: { $ref: "#/components/schemas/Decimal" }
        last_open: { type: string, format: date-time }

    State:
      type: object
      required: [venue, account, positions, limits, risk, killed]
      properties:
        last_close:
          $ref: "#/components/schemas/LastClose"
        venue: { type: string, example: perpl }
        account: { $ref: "#/components/schemas/Account" }
        positions: { type: array, items: { $ref: "#/components/schemas/Position" } }
        limits: { $ref: "#/components/schemas/Limits" }
        risk: { $ref: "#/components/schemas/Risk" }
        killed: { type: boolean }
        kill_note: { type: string }

    OpenRequest:
      type: object
      required: [symbol, side, notional]
      properties:
        symbol: { type: string, example: MON }
        side: { $ref: "#/components/schemas/Side" }
        notional:
          $ref: "#/components/schemas/Decimal"
          description: Position value in collateral units.
        leverage:
          $ref: "#/components/schemas/Decimal"
          description: Defaults to 1.
        strategy:
          type: string
          description: >-
            Which strategy this entry belongs to, for the leaderboard:
            direction (default), ma-cross or rsi.
        horizon_seconds:
          type: integer
          minimum: 0
          description: >-
            The strategy's exit: the platform closes the position this many
            seconds after it opens (10 s to 24 h). 0 or absent leaves the
            close to the user. A manual close disarms it.

    CloseRequest:
      type: object
      required: [symbol]
      properties:
        symbol: { type: string }

    Order:
      type: object
      required: [client_id, venue_id, symbol, side, status, size, filled_size, avg_price, fee, builder_fee]
      properties:
        client_id: { type: string, description: The idempotency key the service generated. }
        venue_id: { type: string }
        symbol: { type: string }
        side: { $ref: "#/components/schemas/Side" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        size: { $ref: "#/components/schemas/Decimal" }
        filled_size: { $ref: "#/components/schemas/Decimal" }
        avg_price: { $ref: "#/components/schemas/Decimal" }
        fee:
          $ref: "#/components/schemas/Decimal"
          description: Gross fee charged, protocol plus builder.
        builder_fee: { $ref: "#/components/schemas/Decimal" }
        rejection:
          type: [object, "null"]
          properties:
            code: { type: string }
            detail: { type: string }
        updated_at: { type: string, format: date-time }

    ExchangeNetwork:
      type: object
      required:
        [network, chain_id, rpc_url, explorer, exchange_address, collateral_token,
         collateral_symbol, collateral_decimals, min_account_open_amount, min_account_open_raw]
      properties:
        network: { type: string, enum: [testnet, mainnet] }
        chain_id: { type: integer, format: int64 }
        rpc_url: { type: string, format: uri }
        explorer: { type: string, format: uri }
        exchange_address: { type: string, description: Exchange contract, lowercase hex }
        collateral_token: { type: string, description: ERC-20 collateral token, lowercase hex }
        collateral_symbol: { type: string }
        collateral_decimals: { type: integer }
        min_account_open_amount:
          $ref: "#/components/schemas/Decimal"
        min_account_open_raw:
          type: string
          description: The same minimum as the raw on-chain integer to pass to createAccount.

    EnrollPayload:
      type: object
      required: [handle, sign_in_message, typed_data, statement, builder_id, max_builder_fee_per_100k, expires_at]
      properties:
        handle: { type: string, description: Single-use; identifies the pending key. }
        sign_in_message: { type: string, description: Sign-In-With-Ethereum text; sign as a personal message. }
        typed_data:
          type: object
          description: EIP-712 document (types, primaryType, domain, message). Sign it exactly as given.
        statement: { type: string, description: The prose the user reads in the wallet prompt. }
        builder_id: { type: integer }
        max_builder_fee_per_100k: { type: integer, description: 1 = 0.1 bps; the ceiling the user consents to. }
        expires_at: { type: string, format: date-time }

    EnrolledKey:
      type: object
      required: [address, label, builder_id, max_builder_fee_per_100k, enrolled_at]
      properties:
        address: { type: string }
        label: { type: string }
        builder_id: { type: integer }
        max_builder_fee_per_100k: { type: integer }
        max_builder_fee_pct: { type: string, example: "0.050%" }
        enrolled_at: { type: string, format: date-time }

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: |
            Stable machine code. Policy denials use the engine's reasons:
            kill_switch, symbol_not_allowed, notional_too_large, notional_too_small,
            leverage_too_high, daily_loss_limit_reached, cooldown,
            too_many_open_positions, total_exposure_too_large, malformed_request.
            Others: invalid_request, venue_rejected, venue_disconnected (503: outcome
            unknown), enrollment_unavailable, no_key, no_exchange_account (409: fund and
            activate the wallet's exchange account), forwarding_disabled (409),
            venue_unconfirmed (504: acknowledged, outcome unknown — reconcile then retry),
            unknown, re-read state and retry), unknown_market, no_position,
            no_credentials, internal.
        message: { type: string, description: For a person. }
        limit: { $ref: "#/components/schemas/Decimal" }
        actual: { $ref: "#/components/schemas/Decimal" }
        retry_after_seconds:
          type: number
          description: Set when the refusal is temporary, e.g. a cooldown.

  responses:
    Invalid:
      description: Malformed request
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Denied:
      description: Refused by the policy engine
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown market or no open position
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    VenueRejected:
      description: The venue refused the order
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
